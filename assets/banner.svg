<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc">
  <title id="title">Krzysztof Obarzanek</title>
  <desc id="desc">Frontend at heart. Backend and mobile too. Based in Kraków, Poland.</desc>
  <defs>
    <radialGradient id="glow">
      <stop stop-color="#8470e8" stop-opacity=".28"/>
      <stop offset="1" stop-color="#8470e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line">
      <stop stop-color="#a89cf7" stop-opacity="0"/>
      <stop offset=".5" stop-color="#a89cf7" stop-opacity=".7"/>
      <stop offset="1" stop-color="#a89cf7" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="870" rx="20"/></clipPath>
  </defs>
  <style>
    .glow { transform-origin: 600px 180px; animation: drift 14s ease-in-out infinite; }
    @keyframes drift {
      0%, 100% { transform: translate(-35px, 8px) scale(1); opacity: .7; }
      50% { transform: translate(45px, -12px) scale(1.12); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) { .glow { animation: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="870" fill="#131419"/>
    <g class="glow">
      <ellipse cx="810" cy="100" rx="520" ry="320" fill="url(#glow)"/>
      <ellipse cx="300" cy="710" rx="420" ry="240" fill="url(#glow)" opacity=".55"/>
    </g>
    <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="600" y="91" fill="#a4a2b5" font-size="14" letter-spacing="4">KRAKÓW, POLAND</text>
      <text x="600" y="174" fill="#f5f4fa" font-size="54" font-weight="600" letter-spacing="-1.5">Krzysztof Obarzanek</text>
      <text x="600" y="226" fill="#bab0f5" font-size="23">Frontend at heart. Backend and mobile too.</text>
      <text x="600" y="334" fill="#c7c5d1" font-size="26">I focus on frontend, building thoughtful web interfaces.</text>
      <text x="600" y="375" fill="#c7c5d1" font-size="26">I also build the backend and mobile experiences behind them.</text>
      <text x="600" y="463" fill="#a4a2b5" font-size="17" letter-spacing="3">FRONTEND</text>
      <text x="600" y="507" fill="#f5f4fa" font-size="30" font-weight="500">TypeScript · React · Next.js</text>
      <text x="600" y="589" fill="#a4a2b5" font-size="17" letter-spacing="3">BACKEND &amp; MOBILE</text>
      <text x="600" y="632" fill="#dedce8" font-size="28">Node.js · Express · NestJS · PostgreSQL</text>
      <text x="600" y="674" fill="#dedce8" font-size="28">React Native · Expo</text>
      <text x="600" y="751" fill="#a4a2b5" font-size="17" letter-spacing="3">AI IN MY WORKFLOW</text>
      <text x="600" y="794" fill="#bab0f5" font-size="26">Claude &amp; Codex — to explore ideas, build, and iterate.</text>
    </g>
    <rect x="480" y="274" width="240" height="1" fill="url(#line)"/>
    <rect x=".5" y=".5" width="1199" height="869" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".07"/>
  </g>
</svg>
